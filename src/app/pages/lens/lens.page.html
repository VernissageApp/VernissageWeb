@if (isReady()) {
    <div animate.enter="fade-in">
        <section [class]="{ 'padding-30': !isHandset(), 'padding-10': isHandset() }">
            <h1><mat-icon>camera</mat-icon> {{ lens() }}</h1>
        </section>

        @if (statuses(); as statusesArray) {
            <app-gallery [statuses]="statusesArray" [startUrl]="pageUrl" />
        }
    </div>
}
